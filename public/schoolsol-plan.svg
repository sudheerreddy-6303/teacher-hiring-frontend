    <linearGradient id="clip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A56DB"/><stop offset="1" stop-color="#12327A"/></linearGradient>
  </defs>
  <rect width="800" height="680" rx="28" fill="url(#bg2)"/>
  <!-- calendar (back) -->
  <g transform="translate(470 120)">
    <rect x="0" y="0" width="250" height="230" rx="18" fill="#fff"/>
    <rect x="0" y="0" width="250" height="52" rx="18" fill="#0EA5E9"/>
    <rect x="0" y="34" width="250" height="20" fill="#0EA5E9"/>
    <rect x="40" y="-14" width="14" height="36" rx="7" fill="#0C7CAE"/>
    <rect x="196" y="-14" width="14" height="36" rx="7" fill="#0C7CAE"/>
    <g fill="#CFE6F6">
      <rect x="22" y="78" width="34" height="26" rx="5"/><rect x="72" y="78" width="34" height="26" rx="5"/><rect x="122" y="78" width="34" height="26" rx="5"/><rect x="172" y="78" width="34" height="26" rx="5"/>
      <rect x="22" y="118" width="34" height="26" rx="5"/><rect x="72" y="118" width="34" height="26" rx="5"/><rect x="122" y="118" width="34" height="26" rx="5"/><rect x="172" y="118" width="34" height="26" rx="5"/>
      <rect x="22" y="158" width="34" height="26" rx="5"/><rect x="72" y="158" width="34" height="26" rx="5"/>
