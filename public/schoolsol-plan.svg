    <rect x="128" y="-30" width="44" height="26" rx="10" fill="#12327A"/>
    <!-- checklist rows -->
    <g>
      <circle cx="56" cy="90" r="18" fill="#DFF5E8"/><path d="M48 90 l6 7 l12 -15" stroke="#059669" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="90" y="82" width="170" height="16" rx="8" fill="#D7E2F3"/>
      <circle cx="56" cy="160" r="18" fill="#DFF5E8"/><path d="M48 160 l6 7 l12 -15" stroke="#059669" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="90" y="152" width="150" height="16" rx="8" fill="#D7E2F3"/>
      <circle cx="56" cy="230" r="18" fill="#DFF5E8"/><path d="M48 230 l6 7 l12 -15" stroke="#059669" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
