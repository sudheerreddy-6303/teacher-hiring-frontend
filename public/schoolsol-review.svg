<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Academic performance review and analytics dashboard">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF2FF"/><stop offset="1" stop-color="#E2ECFF"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1A56DB"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
  </defs>
  <rect width="800" height="520" rx="26" fill="url(#bg3)"/>
  <!-- dashboard window -->
  <g transform="translate(90 70)">
    <rect x="0" y="0" width="470" height="360" rx="18" fill="#fff"/>
    <rect x="0" y="0" width="470" height="46" rx="18" fill="#12327A"/>
    <rect x="0" y="30" width="470" height="16" fill="#12327A"/>
    <circle cx="26" cy="23" r="6" fill="#F87171"/><circle cx="48" cy="23" r="6" fill="#FBBF24"/><circle cx="70" cy="23" r="6" fill="#34D399"/>
    <!-- bars -->
    <g>
      <rect x="40" y="250" width="40" height="70" rx="6" fill="url(#b3)"/>
      <rect x="100" y="210" width="40" height="110" rx="6" fill="url(#b3)"/>
      <rect x="160" y="170" width="40" height="150" rx="6" fill="url(#b3)"/>
      <rect x="220" y="140" width="40" height="180" rx="6" fill="url(#b3)"/>
      <rect x="280" y="110" width="40" height="210" rx="6" fill="url(#b3)"/>
      <path d="M60 240 L120 200 L180 160 L240 130 L300 100" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="300" cy="100" r="7" fill="#F59E0B"/>
    </g>
    <!-- side stats -->
    <g transform="translate(350 90)">
      <rect x="0" y="0" width="90" height="60" rx="10" fill="#EAF2FF"/>
      <rect x="12" y="14" width="46" height="12" rx="6" fill="#1A56DB"/>
      <rect x="12" y="34" width="66" height="10" rx="5" fill="#C9D9F6"/>
      <rect x="0" y="80" width="90" height="60" rx="10" fill="#EAF2FF"/>
      <rect x="12" y="94" width="46" height="12" rx="6" fill="#059669"/>
      <rect x="12" y="114" width="66" height="10" rx="5" fill="#C9D9F6"/>
    </g>
  </g>
  <!-- magnifier -->
  <g transform="translate(470 300)">
    <circle cx="60" cy="60" r="62" fill="#fff" stroke="#1A56DB" stroke-width="12"/>
    <circle cx="60" cy="60" r="40" fill="#EAF2FF"/>
    <path d="M44 60 l12 14 l24 -30" stroke="#059669" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="104" y="104" width="70" height="26" rx="13" transform="rotate(45 104 104)" fill="#12327A"/>
  </g>
</svg>
